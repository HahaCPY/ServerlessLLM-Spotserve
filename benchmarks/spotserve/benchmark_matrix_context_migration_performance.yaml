        "context_migration_reuse_ratio",
        "kv_cache_migration_attempts",
        "kv_cache_migration_successes",
        "kv_cache_migration_tokens",
        "phase_migration_window_success_rate",
        "phase_migration_window_latency_p95_ms",
        "phase_post_migration_success_rate",
        "phase_post_migration_latency_p95_ms",
        "phase_post_migration_throughput_req_s"
      ]
    }
  ]
