services:
  # Head Node
  sllm_head:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/serverlessllm/sllm:latest
    container_name: sllm_head
    environment:
      - MODEL_FOLDER=${MODEL_FOLDER}
      - MODE=HEAD
      - RAY_NUM_CPUS=4
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - RAYON_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - RAY_TEMP_DIR=/raytmp/head
      - RAY_ADDRESS=127.0.0.1:6379
      - HF_HOME=/hf-cache
      - HF_HUB_DISABLE_XET=1
    ports:
      # - "6379:6379"    # Redis port
      - "6380:6379"
      - "8345:8343"    # ServerlessLLM port, host:container
    shm_size: "10gb"
    pids_limit: 32768
    networks:
      - sllm_network
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - /tmp/sllm-ray/head:/raytmp/head
      - ${HF_CACHE_DIR:-/tmp/sllm-hf-cache-rootless}:/hf-cache
    command: []

  # Worker Node 0
  sllm_worker_0:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/serverlessllm/sllm:latest
    container_name: sllm_worker_0
    group_add:
      - keep-groups
    devices:
      - "nvidia.com/gpu=${SLLM_WORKER_0_GPU_DEVICE:-all}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["${SLLM_WORKER_0_GPU_DEVICE:-0}"]
    environment:
      - WORKER_ID=0
      - STORAGE_PATH=/models
      - MODE=WORKER
      - NVIDIA_VISIBLE_DEVICES=${SLLM_WORKER_0_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - RAYON_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - RAY_TEMP_DIR=/raytmp/worker
      - HF_HOME=/hf-cache
      - HF_HUB_DISABLE_XET=1
      - VLLM_NIXL_ABORT_REQUEST_TIMEOUT=120
      - VLLM_NIXL_SIDE_CHANNEL_HOST=127.0.0.1
    shm_size: "10gb"
    pids_limit: 32768
    networks:
      - sllm_network
    volumes:
      - ${MODEL_FOLDER}:/models
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - /tmp/sllm-ray/worker:/raytmp/worker
      - ${HF_CACHE_DIR:-/tmp/sllm-hf-cache-rootless}:/hf-cache
    command: ["--mem-pool-size", "4GB", "--registration-required", "true"] # Customize the memory pool size here

networks:
  sllm_network:
    driver: bridge
    name: sllm
